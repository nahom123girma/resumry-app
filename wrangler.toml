name = "resumry-app"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# --- D1 database binding (available in Functions as env.DB) ------------------
# Create it once:  wrangler d1 create resumry
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "resumry"
database_id = "eea901cd-109f-459b-8df9-5ab3392acbd1"

# --- Non-secret vars (safe to commit) --------------------------------------
[vars]
AI_API_URL = "https://api.openai.com/v1/chat/completions"
AI_MODEL = "gpt-4o-mini"
# GOOGLE_CLIENT_ID is non-secret (it's public on the client too), but set it as a
# var so the server can verify token audience:
# GOOGLE_CLIENT_ID = "xxxxxxxx.apps.googleusercontent.com"

# --- SECRETS (never commit; set via `wrangler pages secret put NAME`) -------
# AI_API_KEY              -> your OpenAI/Gemini/Anthropic key (server-only)
# LS_WEBHOOK_SECRET       -> the signing secret you set on the LS webhook
# LS_VARIANT_PRO_MONTHLY  -> Lemon Squeezy variant id
# LS_VARIANT_PRO_ANNUAL   -> Lemon Squeezy variant id
# LS_VARIANT_LIFETIME     -> Lemon Squeezy variant id
# LS_VARIANT_DOWNLOAD_PASS-> Lemon Squeezy variant id
